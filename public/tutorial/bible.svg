  <rect x="80" y="344" width="812" height="70" rx="10" fill="rgba(13,9,32,0.5)" stroke="rgba(255,255,255,0.05)" stroke-dasharray="6,4" stroke-width="1"/>
  <text x="496" y="384" font-family="system-ui, sans-serif" font-size="14" fill="rgba(240,235,225,0.2)" text-anchor="middle">+ Nuevo tomo — agregar nuevo volumen al canon</text>
