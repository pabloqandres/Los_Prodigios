<svg viewBox="0 0 960 440" width="960" height="440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08060F"/>
      <stop offset="100%" stop-color="#120D28"/>
    </linearGradient>
    <radialGradient id="checkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A52A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F5A52A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="440" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="110" x2="960" y2="110" stroke="rgba(78,205,196,0.04)" stroke-width="1"/>
  <line x1="0" y1="220" x2="960" y2="220" stroke="rgba(78,205,196,0.04)" stroke-width="1"/>
  <line x1="0" y1="330" x2="960" y2="330" stroke="rgba(78,205,196,0.04)" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="440" stroke="rgba(78,205,196,0.04)" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="440" stroke="rgba(78,205,196,0.04)" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="440" stroke="rgba(78,205,196,0.04)" stroke-width="1"/>

  <!-- Scattered sparkles ✦ -->
  <text x="80" y="80" font-family="system-ui, sans-serif" font-size="16" fill="rgba(245,165,42,0.25)">✦</text>
  <text x="840" y="120" font-family="system-ui, sans-serif" font-size="10" fill="rgba(245,165,42,0.2)">✦</text>
  <text x="160" y="380" font-family="system-ui, sans-serif" font-size="12" fill="rgba(78,205,196,0.2)">✦</text>
  <text x="790" y="360" font-family="system-ui, sans-serif" font-size="18" fill="rgba(245,165,42,0.15)">✦</text>
  <text x="50" y="280" font-family="system-ui, sans-serif" font-size="8" fill="rgba(78,205,196,0.2)">✦</text>
  <text x="900" y="280" font-family="system-ui, sans-serif" font-size="12" fill="rgba(155,111,212,0.2)">✦</text>
  <text x="700" y="60" font-family="system-ui, sans-serif" font-size="14" fill="rgba(245,165,42,0.15)">✦</text>
  <text x="240" y="64" font-family="system-ui, sans-serif" font-size="8" fill="rgba(78,205,196,0.2)">✦</text>
  <text x="920" y="400" font-family="system-ui, sans-serif" font-size="10" fill="rgba(155,111,212,0.15)">✦</text>
  <text x="40" y="160" font-family="system-ui, sans-serif" font-size="7" fill="rgba(245,165,42,0.15)">✦</text>

  <!-- Big checkmark circle -->
  <circle cx="480" cy="120" r="60" fill="url(#checkGlow)"/>
  <circle cx="480" cy="120" r="46" fill="rgba(18,13,40,0.8)" stroke="#4ECDC4" stroke-width="2.5"/>
  <path d="M458 120 L472 135 L503 106" stroke="#4ECDC4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- NUPPA COMPLETO in big gold font -->
  <text x="480" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="48" fill="#F5A52A" text-anchor="middle" letter-spacing="6">NUPPA</text>
  <text x="480" y="252" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#F5A52A" text-anchor="middle" letter-spacing="4">COMPLETO</text>

  <!-- Subtitle -->
  <text x="480" y="280" font-family="system-ui, sans-serif" font-size="14" fill="rgba(240,235,225,0.5)" text-anchor="middle">Ya conoces todas las secciones del estudio.</text>

  <!-- Row of section badges -->
  <!-- Dashboard -->
  <rect x="128" y="296" width="104" height="40" rx="8" fill="#120D28" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="180" y="314" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🏠</text>
  <text x="180" y="328" font-family="system-ui, sans-serif" font-size="9" fill="rgba(240,235,225,0.45)" text-anchor="middle">Dashboard</text>

  <!-- Episodios -->
  <rect x="244" y="296" width="104" height="40" rx="8" fill="#120D28" stroke="rgba(245,165,42,0.15)" stroke-width="1"/>
  <text x="296" y="314" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🎞</text>
  <text x="296" y="328" font-family="system-ui, sans-serif" font-size="9" fill="rgba(240,235,225,0.45)" text-anchor="middle">Episodios</text>

  <!-- Arte -->
  <rect x="360" y="296" width="104" height="40" rx="8" fill="#120D28" stroke="rgba(78,205,196,0.15)" stroke-width="1"/>
  <text x="412" y="314" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">✦</text>
  <text x="412" y="328" font-family="system-ui, sans-serif" font-size="9" fill="rgba(240,235,225,0.45)" text-anchor="middle">Arte</text>

  <!-- Biblia Visual -->
  <rect x="476" y="296" width="104" height="40" rx="8" fill="#120D28" stroke="rgba(155,111,212,0.15)" stroke-width="1"/>
  <text x="528" y="314" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">✓</text>
  <text x="528" y="328" font-family="system-ui, sans-serif" font-size="9" fill="rgba(240,235,225,0.45)" text-anchor="middle">Biblia Visual</text>

  <!-- Continuidad -->
  <rect x="592" y="296" width="104" height="40" rx="8" fill="#120D28" stroke="rgba(136,216,176,0.15)" stroke-width="1"/>
  <text x="644" y="314" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🔗</text>
  <text x="644" y="328" font-family="system-ui, sans-serif" font-size="9" fill="rgba(240,235,225,0.45)" text-anchor="middle">Continuidad</text>

  <!-- Workflows -->
  <rect x="708" y="296" width="104" height="40" rx="8" fill="#120D28" stroke="rgba(245,165,42,0.15)" stroke-width="1"/>
  <text x="760" y="314" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">⚙</text>
  <text x="760" y="328" font-family="system-ui, sans-serif" font-size="9" fill="rgba(240,235,225,0.45)" text-anchor="middle">Workflows</text>

  <!-- Bit mascot (robot face, happy) -->
  <rect x="428" y="352" width="52" height="52" rx="10" fill="#F5A52A"/>
  <rect x="436" y="360" width="36" height="32" rx="5" fill="#120D28"/>
  <!-- Happy eyes -->
  <!-- Curved eye lines instead of circles for happy expression -->
  <path d="M442 370 Q447 366 452 370" stroke="#4ECDC4" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M458 370 Q463 366 468 370" stroke="#4ECDC4" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Big smile -->
  <path d="M441 380 Q455 390 469 380" stroke="#F5A52A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Antenna -->
  <rect x="451" y="345" width="4" height="9" rx="2" fill="#F5A52A"/>
  <circle cx="453" cy="343" r="4" fill="#4ECDC4"/>
  <!-- Ears -->
  <rect x="422" y="364" width="7" height="14" rx="4" fill="#F5A52A"/>
  <rect x="511" y="364" width="7" height="14" rx="4" fill="#F5A52A"/>

  <!-- "Nos vemos en el sidebar" text -->
  <text x="480" y="422" font-family="system-ui, sans-serif" font-size="13" fill="rgba(240,235,225,0.4)" text-anchor="middle">Nos vemos en el sidebar</text>
</svg>