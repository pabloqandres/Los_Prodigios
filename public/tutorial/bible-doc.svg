<svg viewBox="0 0 960 440" width="960" height="440" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - dimmed -->
  <rect width="960" height="440" fill="#08060F"/>

  <!-- Overlay dim -->
  <rect width="960" height="440" fill="rgba(0,0,0,0.65)"/>

  <!-- Modal card -->
  <rect x="130" y="30" width="700" height="380" rx="14" fill="#0D0920" stroke="rgba(155,111,212,0.25)" stroke-width="1"/>
  <!-- Modal top accent -->
  <rect x="130" y="30" width="700" height="4" rx="2" fill="#9B6FD4"/>

  <!-- Modal header -->
  <rect x="130" y="34" width="700" height="56" rx="0" fill="rgba(155,111,212,0.06)"/>
  <rect x="130" y="90" width="700" height="1" fill="rgba(255,255,255,0.07)"/>

  <!-- Title area -->
  <text x="160" y="56" font-family="system-ui, sans-serif" font-weight="700" font-size="17" fill="#F0EBE1">Mateo González — Perfil Canónico</text>
  <!-- Tag -->
  <rect x="160" y="64" width="80" height="18" rx="9" fill="rgba(245,165,42,0.15)" stroke="rgba(245,165,42,0.3)" stroke-width="1"/>
  <text x="200" y="77" font-family="monospace" font-size="10" fill="#F5A52A" text-anchor="middle">PROTAGONISTA</text>
  <rect x="248" y="64" width="80" height="18" rx="9" fill="rgba(74,143,232,0.12)" stroke="rgba(74,143,232,0.25)" stroke-width="1"/>
  <text x="288" y="77" font-family="monospace" font-size="10" fill="#4A8FE8" text-anchor="middle">Personajes</text>
  <text x="740" y="60" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.3)">Canon activo · T1E01+</text>

  <!-- Close button -->
  <rect x="790" y="38" width="28" height="28" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="798" y1="46" x2="810" y2="58" stroke="rgba(240,235,225,0.5)" stroke-width="2"/>
  <line x1="810" y1="46" x2="798" y2="58" stroke="rgba(240,235,225,0.5)" stroke-width="2"/>

  <!-- Modal body - left col -->
  <!-- Portrait placeholder -->
  <rect x="160" y="106" width="88" height="110" rx="8" fill="rgba(155,111,212,0.1)" stroke="rgba(155,111,212,0.2)" stroke-width="1"/>
  <circle cx="204" cy="136" r="16" fill="rgba(155,111,212,0.25)"/>
  <rect x="188" y="156" width="32" height="20" rx="10" fill="rgba(155,111,212,0.2)"/>
  <text x="204" y="200" font-family="monospace" font-size="9" fill="rgba(240,235,225,0.2)" text-anchor="middle">retrato</text>

  <!-- Info rows -->
  <text x="264" y="118" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.3)">NOMBRE COMPLETO</text>
  <text x="264" y="134" font-family="system-ui, sans-serif" font-size="14" fill="#F0EBE1" font-weight="600">Mateo Alejandro González</text>
  <text x="264" y="154" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.3)">EDAD · POSICIÓN</text>
  <text x="264" y="170" font-family="system-ui, sans-serif" font-size="13" fill="rgba(240,235,225,0.8)">14 años · Mediocampista ofensivo</text>
  <text x="264" y="190" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.3)">EQUIPO</text>
  <text x="264" y="206" font-family="system-ui, sans-serif" font-size="13" fill="rgba(240,235,225,0.8)">Hawks FC — Academia juvenil</text>

  <!-- Divider -->
  <rect x="160" y="228" width="620" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- Description text block -->
  <text x="160" y="248" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.3)" letter-spacing="1">DESCRIPCIÓN CANÓNICA</text>
  <text x="160" y="266" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.7)">Mateo es un jugador técnicamente brillante pero emocionalmente bloqueado. Criado por su</text>
  <text x="160" y="282" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.7)">abuela tras la partida de su padre, carga con una disciplina casi autolesiva. Su arco</text>
  <text x="160" y="298" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.7)">narrativo central es aprender que el fútbol también puede ser alegría, no solo obligación.</text>
  <text x="160" y="316" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.5)">Rasgos definitorios: metódico, silencioso, leal. Conflicto: excelencia vs. disfrute.</text>

  <!-- Divider -->
  <rect x="160" y="330" width="620" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- Entity chips -->
  <text x="160" y="348" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.3)" letter-spacing="1">ENTIDADES VINCULADAS</text>

  <rect x="160" y="356" width="130" height="22" rx="11" fill="rgba(78,205,196,0.12)" stroke="rgba(78,205,196,0.3)" stroke-width="1"/>
  <text x="225" y="371" font-family="system-ui, sans-serif" font-size="11" fill="#4ECDC4" text-anchor="middle">Mateo González</text>

  <rect x="300" y="356" width="160" height="22" rx="11" fill="rgba(78,205,196,0.12)" stroke="rgba(78,205,196,0.3)" stroke-width="1"/>
  <text x="380" y="371" font-family="system-ui, sans-serif" font-size="11" fill="#4ECDC4" text-anchor="middle">Casa Familia González</text>

  <rect x="470" y="356" width="100" height="22" rx="11" fill="rgba(78,205,196,0.12)" stroke="rgba(78,205,196,0.3)" stroke-width="1"/>
  <text x="520" y="371" font-family="system-ui, sans-serif" font-size="11" fill="#4ECDC4" text-anchor="middle">Hawks FC</text>

  <rect x="580" y="356" width="90" height="22" rx="11" fill="rgba(78,205,196,0.12)" stroke="rgba(78,205,196,0.3)" stroke-width="1"/>
  <text x="625" y="371" font-family="system-ui, sans-serif" font-size="11" fill="#4ECDC4" text-anchor="middle">T1E01–T1E03</text>

  <!-- Bottom action buttons -->
  <rect x="160" y="390" width="130" height="30" rx="6" fill="rgba(155,111,212,0.15)" stroke="rgba(155,111,212,0.3)" stroke-width="1"/>
  <text x="225" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#9B6FD4" text-anchor="middle">✏ Editar</text>

  <rect x="300" y="390" width="150" height="30" rx="6" fill="rgba(245,165,42,0.12)" stroke="rgba(245,165,42,0.25)" stroke-width="1"/>
  <text x="375" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#F5A52A" text-anchor="middle">📋 Copiar al asistente</text>

  <rect x="720" y="390" width="110" height="30" rx="6" fill="rgba(240,235,225,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="775" y="410" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.5)" text-anchor="middle">Cerrar</text>
</svg>
