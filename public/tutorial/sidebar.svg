  <circle cx="244" cy="220" r="3" fill="#F5A52A"/>
  <rect x="322" y="142" width="170" height="36" rx="8" fill="rgba(245,165,42,0.1)" stroke="rgba(245,165,42,0.4)" stroke-width="1"/>
  <text x="407" y="157" font-family="system-ui, sans-serif" font-size="10" fill="#F5A52A" text-anchor="middle" font-weight="600">La columna vertebral</text>
  <text x="407" y="170" font-family="system-ui, sans-serif" font-size="10" fill="rgba(245,165,42,0.7)" text-anchor="middle">de todo el estudio</text>
