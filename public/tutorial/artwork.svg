<svg viewBox="0 0 960 440" width="960" height="440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B6FD4"/>
      <stop offset="60%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#08060F" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="rgba(155,111,212,0.4)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#08060F"/>
  <rect x="0" y="0" width="960" height="3" fill="url(#accentLine)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="56" height="440" fill="#0D0920"/>
  <rect x="56" y="0" width="1" height="440" fill="rgba(255,255,255,0.07)"/>

  <!-- Header -->
  <text x="80" y="52" font-family="system-ui, sans-serif" font-weight="700" font-size="26" fill="#F0EBE1" letter-spacing="3">ARTWORK FLOW</text>
  <text x="80" y="70" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.45)">Constructor de prompts por nodos</text>
  <rect x="80" y="82" width="860" height="1" fill="rgba(255,255,255,0.07)"/>

  <!-- Canvas toolbar -->
  <rect x="80" y="90" width="860" height="30" rx="6" fill="rgba(13,9,32,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="94" y="99" width="56" height="12" rx="6" fill="rgba(155,111,212,0.2)" stroke="rgba(155,111,212,0.3)" stroke-width="1"/>
  <text x="122" y="109" font-family="monospace" font-size="9" fill="#9B6FD4" text-anchor="middle">Nodo +</text>
  <rect x="158" y="99" width="56" height="12" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="186" y="109" font-family="monospace" font-size="9" fill="rgba(240,235,225,0.4)" text-anchor="middle">Auto-layout</text>
  <rect x="222" y="99" width="50" height="12" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="247" y="109" font-family="monospace" font-size="9" fill="rgba(240,235,225,0.4)" text-anchor="middle">Limpiar</text>
  <text x="840" y="110" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.2)">zoom 100%</text>

  <!-- Canvas area -->
  <rect x="80" y="128" width="860" height="300" rx="8" fill="rgba(8,6,15,0.9)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Subtle grid dots -->
  <pattern id="gridDots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect x="80" y="128" width="860" height="300" fill="url(#gridDots)"/>

  <!-- NODE 1: Tipo -->
  <rect x="120" y="200" width="160" height="80" rx="10" fill="#0D0920" stroke="rgba(155,111,212,0.4)" stroke-width="1.5"/>
  <rect x="120" y="200" width="160" height="6" rx="5" fill="#9B6FD4"/>
  <text x="138" y="224" font-family="monospace" font-size="9" fill="rgba(155,111,212,0.7)" letter-spacing="1">TIPO</text>
  <text x="138" y="242" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#F0EBE1">Personaje</text>
  <rect x="138" y="254" width="80" height="16" rx="8" fill="rgba(155,111,212,0.15)" stroke="rgba(155,111,212,0.25)" stroke-width="1"/>
  <text x="178" y="265" font-family="monospace" font-size="9" fill="#9B6FD4" text-anchor="middle">personaje</text>
  <!-- Connector dots -->
  <circle cx="280" cy="240" r="5" fill="#9B6FD4"/>
  <circle cx="120" cy="240" r="5" fill="rgba(155,111,212,0.3)" stroke="rgba(155,111,212,0.4)" stroke-width="1"/>

  <!-- NODE 2: Estilo -->
  <rect x="120" y="330" width="160" height="80" rx="10" fill="#0D0920" stroke="rgba(78,205,196,0.4)" stroke-width="1.5"/>
  <rect x="120" y="330" width="160" height="6" rx="5" fill="#4ECDC4"/>
  <text x="138" y="354" font-family="monospace" font-size="9" fill="rgba(78,205,196,0.7)" letter-spacing="1">ESTILO</text>
  <text x="138" y="372" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#F0EBE1">Anime cinemático</text>
  <rect x="138" y="384" width="100" height="16" rx="8" fill="rgba(78,205,196,0.1)" stroke="rgba(78,205,196,0.25)" stroke-width="1"/>
  <text x="188" y="395" font-family="monospace" font-size="9" fill="#4ECDC4" text-anchor="middle">master_style.md</text>
  <!-- Connector dot -->
  <circle cx="280" cy="370" r="5" fill="#4ECDC4"/>
  <circle cx="120" cy="370" r="5" fill="rgba(78,205,196,0.3)" stroke="rgba(78,205,196,0.4)" stroke-width="1"/>

  <!-- NODE 3: Entidad -->
  <rect x="380" y="200" width="200" height="100" rx="10" fill="#0D0920" stroke="rgba(74,143,232,0.4)" stroke-width="1.5"/>
  <rect x="380" y="200" width="200" height="6" rx="5" fill="#4A8FE8"/>
  <text x="398" y="224" font-family="monospace" font-size="9" fill="rgba(74,143,232,0.7)" letter-spacing="1">ENTIDAD</text>
  <text x="398" y="243" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#F0EBE1">Mateo González</text>
  <text x="398" y="259" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.4)">visual_canon.md cargado</text>
  <rect x="398" y="268" width="80" height="16" rx="8" fill="rgba(74,143,232,0.12)" stroke="rgba(74,143,232,0.25)" stroke-width="1"/>
  <text x="438" y="279" font-family="monospace" font-size="9" fill="#4A8FE8" text-anchor="middle">canon vivo</text>
  <rect x="484" y="268" width="70" height="16" rx="8" fill="rgba(78,205,196,0.1)" stroke="rgba(78,205,196,0.2)" stroke-width="1"/>
  <text x="519" y="279" font-family="monospace" font-size="9" fill="#4ECDC4" text-anchor="middle">T1E03</text>
  <!-- Connector dots -->
  <circle cx="380" cy="250" r="5" fill="rgba(74,143,232,0.3)" stroke="rgba(74,143,232,0.4)" stroke-width="1"/>
  <circle cx="580" cy="250" r="5" fill="#4A8FE8"/>

  <!-- NODE 4: Output -->
  <rect x="670" y="180" width="230" height="140" rx="10" fill="#0D0920" stroke="rgba(245,165,42,0.4)" stroke-width="2"/>
  <rect x="670" y="180" width="230" height="6" rx="5" fill="#F5A52A"/>
  <text x="688" y="206" font-family="monospace" font-size="9" fill="rgba(245,165,42,0.7)" letter-spacing="1">OUTPUT</text>
  <text x="688" y="224" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#F0EBE1">Prompt generado</text>

  <!-- Preview text -->
  <rect x="688" y="230" width="192" height="42" rx="4" fill="rgba(255,255,255,0.03)"/>
  <text x="696" y="243" font-family="monospace" font-size="9" fill="rgba(240,235,225,0.4)">anime cinematic, male teenager,</text>
  <text x="696" y="255" font-family="monospace" font-size="9" fill="rgba(240,235,225,0.4)">athletic build, serious expression...</text>
  <text x="696" y="267" font-family="monospace" font-size="9" fill="rgba(240,235,225,0.25)">--ar 1:1 --style raw</text>

  <!-- Generate button -->
  <rect x="688" y="282" width="194" height="28" rx="6" fill="#F5A52A"/>
  <text x="785" y="300" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#08060F" text-anchor="middle">Generar Prompt</text>
  <!-- Connector dot in -->
  <circle cx="670" cy="250" r="5" fill="rgba(245,165,42,0.3)" stroke="rgba(245,165,42,0.4)" stroke-width="1"/>

  <!-- Arrows between nodes -->
  <!-- Node 1 -> Node 3 -->
  <line x1="280" y1="240" x2="375" y2="250" stroke="rgba(155,111,212,0.35)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Node 2 -> Node 3 -->
  <line x1="280" y1="370" x2="375" y2="275" stroke="rgba(78,205,196,0.35)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Node 3 -> Node 4 -->
  <line x1="582" y1="250" x2="665" y2="250" stroke="rgba(74,143,232,0.35)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Add node buttons on canvas edges -->
  <rect x="860" y="160" width="24" height="24" rx="6" fill="rgba(155,111,212,0.1)" stroke="rgba(155,111,212,0.2)" stroke-width="1"/>
  <text x="872" y="176" font-family="system-ui, sans-serif" font-size="14" fill="rgba(155,111,212,0.4)" text-anchor="middle">+</text>

  <rect x="860" y="360" width="24" height="24" rx="6" fill="rgba(155,111,212,0.1)" stroke="rgba(155,111,212,0.2)" stroke-width="1"/>
  <text x="872" y="376" font-family="system-ui, sans-serif" font-size="14" fill="rgba(155,111,212,0.4)" text-anchor="middle">+</text>

  <rect x="90" y="148" width="24" height="24" rx="6" fill="rgba(155,111,212,0.1)" stroke="rgba(155,111,212,0.2)" stroke-width="1"/>
  <text x="102" y="164" font-family="system-ui, sans-serif" font-size="14" fill="rgba(155,111,212,0.4)" text-anchor="middle">+</text>

  <!-- Node label for Modificador (optional node) -->
  <rect x="380" y="350" width="160" height="70" rx="10" fill="rgba(13,9,32,0.7)" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="460" y="380" font-family="monospace" font-size="10" fill="rgba(240,235,225,0.2)" text-anchor="middle">+ Añadir nodo</text>
  <text x="460" y="396" font-family="monospace" font-size="9" fill="rgba(240,235,225,0.12)" text-anchor="middle">Modificador / Escena</text>

  <!-- Bottom bar -->
  <rect x="80" y="432" width="860" height="8" rx="0" fill="rgba(13,9,32,0.5)"/>
  <text x="96" y="436" font-family="monospace" font-size="9" fill="rgba(240,235,225,0.15)">4 nodos · 3 conexiones · Listo para generar</text>
</svg>
