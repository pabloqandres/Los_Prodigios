  <!-- Script content -->
  <!-- Scene heading -->
  <rect x="93" y="100" width="560" height="20" rx="2" fill="rgba(245,165,42,0.06)"/>
  <text x="105" y="114" font-family="monospace" font-size="12" fill="#F5A52A" font-weight="700">INT. CANCHA LOS HAWKS — DÍA</text>

  <text x="105" y="136" font-family="monospace" font-size="11" fill="rgba(240,235,225,0.55)">La cancha está vacía excepto por el entrenador REYES (50s), que observa</text>
  <text x="105" y="152" font-family="monospace" font-size="11" fill="rgba(240,235,225,0.55)">desde el centro. Los jugadores llegan en grupos. MATEO (16) entra solo.</text>

  <!-- Character cue -->
  <text x="260" y="178" font-family="monospace" font-size="12" fill="#4ECDC4" font-weight="700" text-anchor="middle">REYES</text>
  <!-- Dialogue -->
  <text x="160" y="196" font-family="monospace" font-size="11" fill="rgba(240,235,225,0.8)">González. Llegas exactamente a tiempo. Aquí</text>
  <text x="160" y="212" font-family="monospace" font-size="11" fill="rgba(240,235,225,0.8)">eso significa que llegaste tarde.</text>

  <!-- Parenthetical -->
  <text x="200" y="234" font-family="monospace" font-size="11" fill="rgba(240,235,225,0.4)">(mirando a los otros jugadores)</text>

  <!-- Character cue -->
  <text x="260" y="256" font-family="monospace" font-size="12" fill="#9B6FD4" font-weight="700" text-anchor="middle">MATEO</text>

  <text x="160" y="274" font-family="monospace" font-size="11" fill="rgba(240,235,225,0.8)">Entendido, profe.</text>

  <!-- Scene heading 2 -->
  <rect x="93" y="292" width="560" height="20" rx="2" fill="rgba(245,165,42,0.06)"/>
  <text x="105" y="306" font-family="monospace" font-size="12" fill="#F5A52A" font-weight="700">EXT. BORDE DE LA CANCHA — CONTINUO</text>

  <text x="105" y="328" font-family="monospace" font-size="11" fill="rgba(240,235,225,0.55)">KAEL (17), capitán del equipo, observa a Mateo con los brazos cruzados.</text>
  <text x="105" y="344" font-family="monospace" font-size="11" fill="rgba(240,235,225,0.35)">Su expresión no revela nada, pero sus ojos no se apartan del nuevo.</text>

  <!-- Cursor blink -->
  <rect x="105" y="364" width="2" height="16" rx="1" fill="#F5A52A" opacity="0.8"/>

  <!-- Bottom bar -->
