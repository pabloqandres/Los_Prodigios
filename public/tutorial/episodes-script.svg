  <text x="730" y="258" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.6)">Escenas: <tspan fill="#F0EBE1" font-weight="600">8</tspan></text>
  <text x="730" y="276" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.6)">Personajes: <tspan fill="#F0EBE1" font-weight="600">5</tspan></text>
  <text x="730" y="294" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.6)">Duración est.: <tspan fill="#4ECDC4" font-weight="600">12 min</tspan></text>
