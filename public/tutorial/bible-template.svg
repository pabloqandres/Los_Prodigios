<svg viewBox="0 0 960 440" width="960" height="440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B6FD4"/>
      <stop offset="60%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#08060F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="440" fill="#08060F"/>
  <rect x="0" y="0" width="960" height="3" fill="url(#accentLine)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="56" height="440" fill="#06040F"/>
  <rect x="56" y="0" width="1" height="440" fill="rgba(255,255,255,0.07)"/>
  <rect x="16" y="28" width="24" height="6" rx="3" fill="rgba(245,165,42,0.6)"/>
  <rect x="16" y="76" width="24" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
  <rect x="16" y="112" width="24" height="24" rx="6" fill="#F5A52A"/>
  <rect x="20" y="117" width="16" height="2" rx="1" fill="#08060F"/>
  <rect x="20" y="122" width="16" height="2" rx="1" fill="#08060F"/>
  <rect x="20" y="127" width="10" height="2" rx="1" fill="#08060F"/>

  <!-- Dimmed background page -->
  <rect x="57" y="0" width="903" height="440" fill="#08060F" opacity="0.6"/>
  <text x="80" y="38" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="rgba(240,235,225,0.2)" letter-spacing="2">BIBLIA</text>

  <!-- Modal overlay -->
  <rect x="0" y="0" width="960" height="440" fill="rgba(8,6,15,0.75)"/>

  <!-- Modal panel -->
  <rect x="220" y="60" width="520" height="320" rx="12" fill="#120D28" stroke="rgba(245,165,42,0.3)" stroke-width="1"/>

  <!-- Modal header -->
  <rect x="220" y="60" width="520" height="52" rx="12" fill="#1A1336"/>
  <rect x="220" y="100" width="520" height="12" fill="#1A1336"/>
  <text x="480" y="94" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#F0EBE1" text-anchor="middle">Nuevo documento</text>
  <!-- Close button -->
  <circle cx="718" cy="86" r="10" fill="rgba(255,255,255,0.06)"/>
  <text x="718" y="90" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.4)" text-anchor="middle">✕</text>

  <!-- Two columns -->
  <!-- Left column: Upload -->
  <rect x="236" y="124" width="230" height="240" rx="8" fill="#0D0920" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="351" y="148" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.5)" text-anchor="middle" font-weight="600">Subir archivo</text>

  <!-- Dashed upload zone -->
  <rect x="252" y="158" width="198" height="140" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Cloud up icon -->
  <rect x="335" y="196" width="32" height="20" rx="4" fill="rgba(245,165,42,0.15)"/>
  <path d="M344 206 L351 199 L358 206" stroke="#F5A52A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="351" y1="199" x2="351" y2="212" stroke="#F5A52A" stroke-width="2" stroke-linecap="round"/>
  <text x="351" y="230" font-family="system-ui, sans-serif" font-size="11" fill="rgba(240,235,225,0.5)" text-anchor="middle">Arrastra aquí</text>
  <text x="351" y="246" font-family="system-ui, sans-serif" font-size="11" fill="rgba(240,235,225,0.35)" text-anchor="middle">o haz clic</text>

  <rect x="296" y="272" width="110" height="18" rx="9" fill="rgba(78,205,196,0.15)" stroke="rgba(78,205,196,0.3)" stroke-width="1"/>
  <text x="351" y="284" font-family="monospace" font-size="9" fill="#4ECDC4" text-anchor="middle">.docx / .md / .pdf</text>

  <!-- Right column: Templates -->
  <rect x="482" y="124" width="242" height="240" rx="8" fill="#0D0920" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="603" y="148" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.5)" text-anchor="middle" font-weight="600">Crear desde template</text>

  <!-- Template rows -->
  <rect x="494" y="158" width="218" height="40" rx="6" fill="#120D28" stroke="rgba(245,165,42,0.15)" stroke-width="1"/>
  <text x="510" y="177" font-family="system-ui, sans-serif" font-size="13" fill="#F5A52A">👤</text>
  <text x="530" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#F0EBE1" font-weight="600">Ficha de Personaje</text>
  <text x="530" y="188" font-family="system-ui, sans-serif" font-size="10" fill="rgba(240,235,225,0.35)">Biografía, apariencia, arco</text>
  <text x="700" y="182" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.25)">→</text>

  <rect x="494" y="204" width="218" height="40" rx="6" fill="#120D28" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="510" y="223" font-family="system-ui, sans-serif" font-size="13" fill="#4ECDC4">📍</text>
  <text x="530" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#F0EBE1" font-weight="600">Ficha de Locación</text>
  <text x="530" y="234" font-family="system-ui, sans-serif" font-size="10" fill="rgba(240,235,225,0.35)">Ambiente, función narrativa</text>
  <text x="700" y="228" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.25)">→</text>

  <rect x="494" y="250" width="218" height="40" rx="6" fill="#120D28" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="510" y="269" font-family="system-ui, sans-serif" font-size="13" fill="#9B6FD4">🎯</text>
  <text x="530" y="266" font-family="system-ui, sans-serif" font-size="12" fill="#F0EBE1" font-weight="600">Ficha de Prop</text>
  <text x="530" y="280" font-family="system-ui, sans-serif" font-size="10" fill="rgba(240,235,225,0.35)">Objeto, uso, historia</text>
  <text x="700" y="274" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.25)">→</text>

  <rect x="494" y="296" width="218" height="40" rx="6" fill="#120D28" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="510" y="315" font-family="system-ui, sans-serif" font-size="13" fill="#88D8B0">📝</text>
  <text x="530" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#F0EBE1" font-weight="600">Doc de Lore libre</text>
  <text x="530" y="326" font-family="system-ui, sans-serif" font-size="10" fill="rgba(240,235,225,0.35)">Notas, historia, reglas del mundo</text>
  <text x="700" y="320" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.25)">→</text>

  <!-- Divider between columns -->
  <line x1="480" y1="124" x2="480" y2="364" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Cancel button -->
  <text x="480" y="394" font-family="system-ui, sans-serif" font-size="12" fill="rgba(240,235,225,0.3)" text-anchor="middle">Cancelar</text>
</svg>